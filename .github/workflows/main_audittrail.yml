name: Test and deploy AuditTrail

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test frontend
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Test backend
        run: python -m pytest -v
      - uses: actions/upload-artifact@v4
        with:
          name: application
          path: |
            backend/
            frontend/dist/audittrail/browser/
            requirements.txt

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A8803671AFB341BE94CBECA271FF5AB6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4E6207502750490EA1BC05E3356C9A6F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_80E2ACACE30345F2A97D825F78B478D2 }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: audittrail
          slot-name: Production
          package: .
          startup-command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
