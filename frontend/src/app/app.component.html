@if (error()) {
  <div class="notice" role="alert">
    <span>{{ error() }}</span>
    @if (!auth.user()) {
      <button hlmBtn variant="outline" type="button" (click)="restoreSession()">Retry</button>
    }
  </div>
}

@if (loading()) {
  <p class="session-loading" role="status">Checking your session…</p>
} @else {
  @if (auth.user(); as user) {
    <header class="app-header">
      <strong>AuditTrail</strong>
      <span>{{ user.email }}</span>
      <button hlmBtn variant="outline" type="button" [disabled]="busy()" (click)="logout()">
        {{ busy() ? 'Signing out…' : 'Sign out' }}
      </button>
    </header>
  } @else {
    <app-login [busy]="busy()" (signIn)="login()" />
  }

  <app-documents />
}
