<main class="login-page">
  <div class="login-container">
    <p class="login-brand">AuditTrail</p>
    <section hlmCard class="login-card" aria-labelledby="login-title">
      <h1 id="login-title" class="login-title">Sign in to AuditTrail</h1>
      <p class="login-description">Use your work account to continue.</p>
      <button hlmBtn type="button" class="login-button" [disabled]="busy()" (click)="signIn.emit()">
        {{ busy() ? 'Please wait…' : 'Sign in with Microsoft' }}
      </button>
    </section>
  </div>
</main>
