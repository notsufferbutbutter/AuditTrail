services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Override with your registry image when preparing a deployment.
    image: ${API_IMAGE:-audittrail-api:latest}
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
